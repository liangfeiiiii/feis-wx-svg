form attributeName=\"transform\" type=\"translate\" values=\"0 18;0 18;0 0;0 0;0 -6;0 18\" keyTimes=\"0;0.0889;0.15;0.9056;0.9689;1\" dur=\"9s\" repeatCount=\"indefinite\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.22 1 0.36 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1\"/><\/g><\/svg><\/section><h2 data-feis-h2=\"1\" style=\"margin:36px 0 16px;font-size:19px;font-weight:700;line-height:1.4;color:#1D1D1F;letter-spacing:0px;\">配套 Chrome 侧边栏插件<\/h2><p data-feis-p=\"1\" style=\"margin:0 0 24px;font-size:15px;line-height:1.8;letter-spacing:0px;color:#2C2C2E;text-align:left;\">为了平时发稿顺手，我还顺带做了一个配套的 Chrome 侧边栏插件。<\/p><p data-feis-p=\"1\" style=\"margin:0 0 24px;font-size:15px;line-height:1.8;letter-spacing:0px;color:#2C2C2E;text-align:left;\">以前做完 SVG 还要找第三方网页粘贴中转，来回切窗口很打断写作节奏。现在直接在公众号后台点开侧边栏，把生成好的模块包拖进去，插件会自动检查有没有触发微信禁忌、支持一键切换深浅底预览，点一下就能把整篇文章或者单个模块直接插进正文。<\/p><section style=\"margin:24px 0;padding:0;line-height:0;font-size:0;border-radius:16px;overflow:hidden;background-color:#F5F5F7;\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 750 596\" width=\"100%\" style=\"display:block;width:100%;height:auto;border-radius:16px;background-color:#F5F5F7;\"><rect x=\"0\" y=\"0\" width=\"750\" height=\"596\" rx=\"28\" fill=\"#F5F5F7\"/><g opacity=\"0\"><text x=\"48\" y=\"64\" font-size=\"21\" font-weight=\"600\" letter-spacing=\"1.6\" fill=\"#0071E3\" font-family='-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"PingFang SC\", \"Helvetica Neue\", sans-serif'>WORKFLOW<\/text><animate attributeName=\"opacity\" values=\"0;0;1;1;0;0\" keyTimes=\"0;0.0067;0.0567;0.9056;0.9689;1\" dur=\"9s\" repeatCount=\"indefinite\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.22 1 0.36 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1\"/><animateTransform attributeName=\"transform\" type=\"translate\" values=\"0 10;0 10;0 0;0 0;0 -6;0 10\" keyTimes=\"0;0.0067;0.0567;0.9056;0.9689;1\" dur=\"9s\" repeatCount=\"indefinite\" calcMode=\"spline\" keySplines=\"0 0 1 1;0.22 1 0.36 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1\"/><\/g><g opacity=\   const s = document.getElementById('stage');
  s.innerHTML = '';
  requestAnimationFrame(renderAll);
}
function toggleMode() {
  document.documentElement.dataset.mode = document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark';
}
async function copyWhole() {
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([PACK.articleHtml], {type: 'text/html'}),
      'text/plain': new Blob([PACK.articleHtml], {type: 'text/plain'})
    })]);
    showToast('已复制整篇文章，去公众号编辑器按 ⌘V 粘贴');
  } catch (e) {
    showToast('本地 file:// 受限时，请把 feis-pack.json 拖进 Chrome 插件一键复制');
  }
}
renderAll();
</script>
